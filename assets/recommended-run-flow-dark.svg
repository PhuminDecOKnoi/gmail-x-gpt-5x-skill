<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Recommended Run Flow</title>
  <desc id="desc">Dark tone workflow diagram showing five steps: Define Gmail scope, Classify or rank, Freeze snapshot, Confirm gated action, and Execute and verify.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="46%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="20%" cy="20%" r="58%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="82%" cy="78%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.24"/>
      <stop offset="56%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="nodeHot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1600" height="560" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="32" fill="url(#glowBlue)"/>
  <rect width="1600" height="560" rx="32" fill="url(#glowGreen)"/>

  <g opacity="0.18" stroke="#38bdf8" stroke-width="1">
    <path d="M100 72 H1500 M100 488 H1500 M112 68 V492 M1488 68 V492" fill="none"/>
    <path d="M0 128 H1600 M0 256 H1600 M0 384 H1600" opacity="0.34"/>
    <path d="M160 0 V560 M320 0 V560 M480 0 V560 M640 0 V560 M800 0 V560 M960 0 V560 M1120 0 V560 M1280 0 V560 M1440 0 V560" opacity="0.22"/>
  </g>

  <g transform="translate(98 68)">
    <rect x="0" y="0" width="424" height="54" rx="27" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="24" y="37" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="800" fill="#d1fae5" letter-spacing="0.8">RECOMMENDED RUN FLOW</text>
    <text x="0" y="102" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#bae6fd">Scope first. Confirm before gated action. Verify after execution.</text>
  </g>

  <g font-family="Inter, DejaVu Sans, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(104 226)">
      <rect width="234" height="156" rx="22" fill="url(#node)" stroke="#38bdf8" stroke-width="2.4"/>
      <circle cx="44" cy="44" r="23" fill="#0ea5e9" filter="url(#softGlow)"/>
      <text x="44" y="53" text-anchor="middle" font-size="27" font-weight="900" fill="#f8fafc">1</text>
      <text x="26" y="94" font-size="27" font-weight="850" fill="#f8fafc">Define</text>
      <text x="26" y="127" font-size="27" font-weight="850" fill="#f8fafc">Gmail scope</text>
    </g>

    <g transform="translate(390 226)">
      <rect width="234" height="156" rx="22" fill="url(#node)" stroke="#34d399" stroke-width="2.4"/>
      <circle cx="44" cy="44" r="23" fill="#10b981" filter="url(#softGlow)"/>
      <text x="44" y="53" text-anchor="middle" font-size="27" font-weight="900" fill="#f8fafc">2</text>
      <text x="26" y="94" font-size="27" font-weight="850" fill="#f8fafc">Classify</text>
      <text x="26" y="127" font-size="27" font-weight="850" fill="#f8fafc">or rank</text>
    </g>

    <g transform="translate(676 226)">
      <rect width="234" height="156" rx="22" fill="url(#node)" stroke="#818cf8" stroke-width="2.4"/>
      <circle cx="44" cy="44" r="23" fill="#6366f1" filter="url(#softGlow)"/>
      <text x="44" y="53" text-anchor="middle" font-size="27" font-weight="900" fill="#f8fafc">3</text>
      <text x="26" y="94" font-size="27" font-weight="850" fill="#f8fafc">Freeze</text>
      <text x="26" y="127" font-size="27" font-weight="850" fill="#f8fafc">snapshot</text>
    </g>

    <g transform="translate(962 226)">
      <rect width="234" height="156" rx="22" fill="url(#nodeHot)" stroke="#facc15" stroke-width="2.4"/>
      <circle cx="44" cy="44" r="23" fill="#facc15" filter="url(#softGlow)"/>
      <text x="44" y="53" text-anchor="middle" font-size="27" font-weight="900" fill="#0f172a">4</text>
      <text x="26" y="94" font-size="27" font-weight="850" fill="#f8fafc">Confirm</text>
      <text x="26" y="127" font-size="27" font-weight="850" fill="#f8fafc">gated action</text>
    </g>

    <g transform="translate(1248 226)">
      <rect width="248" height="156" rx="22" fill="url(#node)" stroke="#38bdf8" stroke-width="2.4"/>
      <circle cx="44" cy="44" r="23" fill="#38bdf8" filter="url(#softGlow)"/>
      <text x="44" y="53" text-anchor="middle" font-size="27" font-weight="900" fill="#0f172a">5</text>
      <text x="26" y="94" font-size="27" font-weight="850" fill="#f8fafc">Execute</text>
      <text x="26" y="127" font-size="27" font-weight="850" fill="#f8fafc">and verify</text>
    </g>
  </g>

  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.94">
    <path d="M346 304 H374"/>
    <path d="M632 304 H660"/>
    <path d="M918 304 H946"/>
    <path d="M1204 304 H1232"/>
  </g>

  <g font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="750" fill="#94a3b8">
    <text x="146" y="444">Requested mailbox scope only</text>
    <text x="435" y="444">Metadata + context</text>
    <text x="704" y="444">Rank-to-message mapping</text>
    <text x="984" y="444">Exact current approval</text>
    <text x="1280" y="444">Re-scan final counts</text>
  </g>

  <rect x="30" y="30" width="1540" height="500" rx="28" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.88"/>
</svg>
