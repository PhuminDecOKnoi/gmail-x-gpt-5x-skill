  <text x="1210" y="584" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#94a3b8">v1.3.0 README Standard</text>
  <rect x="30" y="30" width="1540" height="580" rx="30" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.90"/>
</svg>
