<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Gmail X GPT 5.x SKILL</title>
  <desc id="desc">Dark professional title banner for a Gmail and GPT 5.x skill repository focused on safe triage, ranked cleanup, labels, and verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="78%" cy="32%" r="42%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.36"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="63%" cy="78%" r="40%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.68"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#cyanGlow)"/>
  <rect width="1600" height="640" fill="url(#greenGlow)"/>

  <g opacity="0.32" stroke="#38bdf8" stroke-width="1">
    <path d="M0 96 C280 20, 496 144, 768 88 S1248 20, 1600 86" fill="none"/>
    <path d="M0 540 C260 470, 420 610, 730 530 S1230 450, 1600 520" fill="none"/>
    <path d="M78 0 V640 M246 0 V640 M414 0 V640 M582 0 V640 M750 0 V640 M918 0 V640 M1086 0 V640 M1254 0 V640 M1422 0 V640" opacity="0.10"/>
    <path d="M0 112 H1600 M0 224 H1600 M0 336 H1600 M0 448 H1600 M0 560 H1600" opacity="0.10"/>
  </g>

  <g transform="translate(958 80)" filter="url(#shadow)">
