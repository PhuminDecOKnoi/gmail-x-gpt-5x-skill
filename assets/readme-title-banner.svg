    <text x="24" y="37" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#d1fae5" letter-spacing="1">PROMPT-AI / GMAIL SKILL</text>

    <text x="0" y="164" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="86" font-weight="800" fill="#f8fafc" filter="url(#shadow)">Gmail X GPT 5.x</text>
    <text x="0" y="256" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="86" font-weight="800" fill="#f8fafc" filter="url(#shadow)">SKILL</text>
    <text x="0" y="302" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" fill="#bae6fd">Safe triage. Ranked cleanup. Verified actions.</text>

