    <path d="M198 56 L208 66 L224 43" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="308" y="0" width="112" height="112" rx="24" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.55"/>
    <path d="M345 39 H383 M345 56 H383 M345 73 H383" stroke="#818cf8" stroke-width="7" stroke-linecap="round"/>
  </g>

