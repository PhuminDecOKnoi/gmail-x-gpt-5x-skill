    <path d="M36 23 L52 37 L68 23" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="92" y="18" width="150" height="10" rx="5" fill="#93c5fd" opacity="0.82"/>
    <rect x="92" y="39" width="260" height="9" rx="4.5" fill="#64748b" opacity="0.70"/>
    <circle cx="398" cy="36" r="11" fill="#34d399" filter="url(#softGlow)"/>

    <rect x="106" y="116" width="502" height="86" rx="20" fill="url(#card)" stroke="#34d399" stroke-opacity="0.60"/>
    <rect x="142" y="145" width="40" height="30" rx="5" fill="#dcfce7"/>
    <path d="M146 148 L162 162 L178 148" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="206" y="140" width="160" height="10" rx="5" fill="#a7f3d0" opacity="0.82"/>
    <rect x="206" y="164" width="310" height="9" rx="4.5" fill="#64748b" opacity="0.70"/>

    <rect x="344" y="242" width="470" height="96" rx="22" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.80"/>
    <rect x="382" y="275" width="44" height="32" rx="6" fill="#e0f2fe"/>
    <path d="M386 279 L404 294 L422 279" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="454" y="270" width="188" height="12" rx="6" fill="#bfdbfe" opacity="0.82"/>
    <rect x="454" y="298" width="290" height="10" rx="5" fill="#64748b" opacity="0.72"/>
