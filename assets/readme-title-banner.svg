      <text x="18" y="32" fill="#f8fafc">Rank</text>
      <rect x="134" y="0" width="116" height="48" rx="18" fill="#34d399"/>
      <text x="152" y="32" fill="#f8fafc">Label</text>
      <rect x="274" y="0" width="152" height="48" rx="18" fill="#facc15"/>
      <text x="292" y="32" fill="#f8fafc">Confirm</text>
      <rect x="450" y="0" width="124" height="48" rx="18" fill="#818cf8"/>
      <text x="468" y="32" fill="#f8fafc">Verify</text>
